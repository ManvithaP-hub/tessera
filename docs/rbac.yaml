# Minimal read-only access for Tessera.
#
# Tessera only lists and reads. Bind this ClusterRole to the user or group
# your kubeconfig authenticates as, for example:
#
#   kubectl apply -f docs/rbac.yaml
#   kubectl create clusterrolebinding tessera-viewer-jane \
#     --clusterrole=tessera-viewer --user=jane@example.com
#
# On EKS with access entries, associate the principal with an access policy
# or a Kubernetes group that is bound to this role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tessera-viewer
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "events", "namespaces", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses", "networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  # Optional: Istio routing checks. Harmless if Istio isn't installed.
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "destinationrules"]
    verbs: ["get", "list"]
  # Optional: lets Tessera check that ingress TLS secrets exist. Tessera
  # requests metadata only (names), never secret contents, but Kubernetes RBAC
  # can't grant "names only", so leave this out if that's a concern. The TLS
  # check is simply skipped without it.
  # - apiGroups: [""]
  #   resources: ["secrets"]
  #   verbs: ["list"]
