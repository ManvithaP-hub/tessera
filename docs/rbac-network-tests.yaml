# Lets a person run Tessera network tests in ONE namespace only.
# Apply per namespace, and preferably only on non-production clusters:
#
#   kubectl apply -n team-a -f docs/rbac-network-tests.yaml
#   kubectl create rolebinding tessera-network-tests-jane -n team-a \
#     --role=tessera-network-tests --user=jane@example.com
#
# Probe pods are created and deleted by Tessera within ~90 seconds.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tessera-network-tests
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
